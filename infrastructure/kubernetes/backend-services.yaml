apiVersion: apps/v1
kind: Deployment
metadata: {name: order-service, namespace: logistics}
spec:
  replicas: 1
  selector: {matchLabels: {app: order-service}}
  template:
    metadata: {labels: {app: order-service}}
    spec:
      containers:
        - name: order-service
          image: cnative-order-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8082}]
          env:
            - {name: PORT, value: "8082"}
            - {name: SPRING_DATASOURCE_URL, value: jdbc:postgresql://postgres:5432/logistics}
            - {name: SPRING_DATASOURCE_USERNAME, valueFrom: {secretKeyRef: {name: logistics-secrets, key: POSTGRES_USER}}}
            - {name: SPRING_DATASOURCE_PASSWORD, valueFrom: {secretKeyRef: {name: logistics-secrets, key: POSTGRES_PASSWORD}}}
            - {name: RABBITMQ_HOST, value: rabbitmq}
            - {name: RABBITMQ_PORT, value: "5672"}
            - {name: JWT_SECRET, valueFrom: {secretKeyRef: {name: logistics-secrets, key: JWT_SECRET}}}
            - {name: JWT_ISSUER, valueFrom: {secretKeyRef: {name: logistics-secrets, key: JWT_ISSUER}}}
            - {name: JWT_AUDIENCE, valueFrom: {secretKeyRef: {name: logistics-secrets, key: JWT_AUDIENCE}}}
            - {name: JAVA_TOOL_OPTIONS, value: "-Xms64m -Xmx320m"}
          startupProbe:
            httpGet: {path: /actuator/health, port: 8082}
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet: {path: /actuator/health, port: 8082}
            timeoutSeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /actuator/health, port: 8082}
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: 750m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata: {name: order-service, namespace: logistics}
spec:
  selector: {app: order-service}
  ports: [{port: 8082, targetPort: 8082}]
---
