apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: logistics
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: logistics
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: logistics-secrets, key: POSTGRES_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: logistics-secrets, key: POSTGRES_PASSWORD}}
            - {name: POSTGRES_DB, value: logistics}
          ports: [{containerPort: 5432}]
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
          startupProbe:
            tcpSocket: {port: 5432}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket: {port: 5432}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: 5432}
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: logistics
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-data
  namespace: logistics
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: logistics
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: mongodb}
  template:
    metadata:
      labels: {app: mongodb}
    spec:
      containers:
        - name: mongodb
          image: mongo:8
          ports: [{containerPort: 27017}]
          volumeMounts:
            - {name: data, mountPath: /data/db}
          startupProbe:
            tcpSocket: {port: 27017}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket: {port: 27017}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: 27017}
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 750m, memory: 768Mi}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mongodb-data
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: logistics
spec:
  selector: {app: mongodb}
  ports: [{port: 27017, targetPort: 27017}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-data
  namespace: logistics
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: logistics
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: rabbitmq}
  template:
    metadata:
      labels: {app: rabbitmq}
    spec:
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: rabbitmq
          image: rabbitmq:4-management
          ports: [{containerPort: 5672}, {containerPort: 15672}]
          volumeMounts:
            - {name: data, mountPath: /var/lib/rabbitmq}
          startupProbe:
            tcpSocket: {port: 5672}
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket: {port: 5672}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: 5672}
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rabbitmq-data
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: logistics
spec:
  selector: {app: rabbitmq}
  ports:
    - {name: amqp, port: 5672, targetPort: 5672}
    - {name: management, port: 15672, targetPort: 15672}
