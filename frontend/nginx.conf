server {
  listen 80;
  root /usr/share/nginx/html;
  location /api/ {
    proxy_pass http://api-gateway:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Origin "";
  }
  location /health {
    proxy_pass http://api-gateway:8080;
  }
  location / {
    try_files $uri /index.html;
  }
}
