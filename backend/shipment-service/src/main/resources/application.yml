spring.application.name: shipment-service
server.port: ${PORT:8084}
spring.data.mongodb.uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/logistics}
spring.datasource.url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/logistics}
spring.datasource.username: ${SPRING_DATASOURCE_USERNAME:logistics}
spring.datasource.password: ${SPRING_DATASOURCE_PASSWORD:local-only-change-me}
spring.jpa.hibernate.ddl-auto: update
spring.rabbitmq.host: ${RABBITMQ_HOST:localhost}
management.endpoints.web.exposure.include: health,info,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests: true
shipment.simulation.enabled: ${SHIPMENT_SIMULATION_ENABLED:true}
shipment.simulation.interval-ms: ${SHIPMENT_SIMULATION_INTERVAL_MS:10000}

app.jwt.secret: ${JWT_SECRET:change-this-development-secret-32-chars-minimum}
app.jwt.issuer: ${JWT_ISSUER:logistics-platform}
app.jwt.audience: ${JWT_AUDIENCE:logistics-api}
app.jwt.expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
