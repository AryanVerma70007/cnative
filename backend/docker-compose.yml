services:
  postgres:
    image: postgres:17-alpine
    environment: {POSTGRES_USER: logistics, POSTGRES_PASSWORD: local-only-change-me, POSTGRES_DB: logistics}
    ports: ["5432:5432"]
  mongodb:
    image: mongo:8
    ports: ["27017:27017"]
  rabbitmq:
    image: rabbitmq:4-management
    ports: ["5672:5672", "15672:15672"]
  api-gateway:
    build: ./api-gateway
    ports: ["8081:8081"]
    depends_on: [order-service, inventory-service, shipment-service, notification-service]
  order-service:
    build: ./order-service
    ports: ["8082:8082"]
    environment: {SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/logistics, RABBITMQ_HOST: rabbitmq}
  inventory-service:
    build: ./inventory-service
    ports: ["8083:8083"]
    environment: {SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/logistics, RABBITMQ_HOST: rabbitmq}
  shipment-service:
    build: ./shipment-service
    ports: ["8084:8084"]
    environment: {SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/logistics, RABBITMQ_HOST: rabbitmq}
  notification-service:
    build: ./notification-service
    ports: ["8085:8085"]
    environment: {SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/logistics, RABBITMQ_HOST: rabbitmq}
