spring.application.name: order-service
server.port: ${PORT:8082}
spring.datasource.url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/logistics}
spring.datasource.username: ${SPRING_DATASOURCE_USERNAME:logistics}
spring.datasource.password: ${SPRING_DATASOURCE_PASSWORD:local-only-change-me}
spring.jpa.hibernate.ddl-auto: update
spring.jpa.open-in-view: false
spring.rabbitmq.host: ${RABBITMQ_HOST:localhost}
spring.rabbitmq.port: ${RABBITMQ_PORT:5672}
spring.rabbitmq.listener.simple.default-requeue-rejected: false
spring.rabbitmq.listener.simple.retry.enabled: true
spring.rabbitmq.listener.simple.retry.max-attempts: 5
spring.rabbitmq.listener.simple.retry.initial-interval: 1000ms
spring.rabbitmq.listener.simple.retry.multiplier: 2
spring.rabbitmq.listener.simple.retry.max-interval: 60000ms
outbox.publisher.delay-ms: ${OUTBOX_PUBLISHER_DELAY_MS:1000}
management.endpoints.web.exposure.include: health,info,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests: true

app.jwt.secret: ${JWT_SECRET:change-this-development-secret-32-chars-minimum}
app.jwt.issuer: ${JWT_ISSUER:logistics-platform}
app.jwt.audience: ${JWT_AUDIENCE:logistics-api}
app.jwt.expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
