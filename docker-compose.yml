services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: logistics
      POSTGRES_PASSWORD: local-only-change-me
      POSTGRES_DB: logistics
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logistics -d logistics"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongodb:
    image: mongo:8
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management
    ports: ["5672:5672", "15672:15672"]
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  order-service:
    build: ./backend/order-service
    environment:
      PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/logistics
      SPRING_DATASOURCE_USERNAME: logistics
      SPRING_DATASOURCE_PASSWORD: local-only-change-me
      RABBITMQ_HOST: rabbitmq
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}

  inventory-service:
    build: ./backend/inventory-service
    environment:
      PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/logistics
      SPRING_DATASOURCE_USERNAME: logistics
      SPRING_DATASOURCE_PASSWORD: local-only-change-me
      RABBITMQ_HOST: rabbitmq
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}

  shipment-service:
    build: ./backend/shipment-service
    environment:
      PORT: 8084
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/logistics
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/logistics
      SPRING_DATASOURCE_USERNAME: logistics
      SPRING_DATASOURCE_PASSWORD: local-only-change-me
      RABBITMQ_HOST: rabbitmq
    depends_on:
      mongodb: {condition: service_healthy}
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}

  notification-service:
    build: ./backend/notification-service
    environment:
      PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/logistics
      SPRING_DATASOURCE_USERNAME: logistics
      SPRING_DATASOURCE_PASSWORD: local-only-change-me
      RABBITMQ_HOST: rabbitmq
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}

  api-gateway:
    build: ./backend/api-gateway
    environment:
      PORT: 8080
      ORDER_SERVICE_URL: http://order-service:8082
      INVENTORY_SERVICE_URL: http://inventory-service:8083
      SHIPMENT_SERVICE_URL: http://shipment-service:8084
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
    ports: ["8090:8080"]
    depends_on: [order-service, inventory-service, shipment-service, notification-service]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      api-gateway: {condition: service_healthy}
    ports: ["5173:80"]

  prometheus:
    image: prom/prometheus:v3.5.0
    ports: ["9090:9090"]
    volumes: [./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    depends_on: [api-gateway]

  grafana:
    image: grafana/grafana:12.1.1
    ports: ["3000:3000"]
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres-data:
  mongo-data:
  rabbitmq-data:
